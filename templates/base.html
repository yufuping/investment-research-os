<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Investment Research OS{% endblock %}</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f4f7fb;color:#172033;margin:0}main{max-width:900px;margin:40px auto;padding:0 18px}.panel{background:white;border:1px solid #dae4f0;border-radius:14px;padding:24px;box-shadow:0 4px 18px #18243b12;margin-bottom:18px}h1{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid #b9c8dc;border-radius:8px;font:inherit}textarea{min-height:90px}.button,button{display:inline-block;border:0;border-radius:8px;padding:11px 16px;background:#2f6fed;color:white;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#eef3fa;color:#244b7b}.error{background:#fde8e8;color:#981b1b;padding:11px;border-radius:8px}.notice{background:#fff5cf;padding:12px;border-left:4px solid #d79b00}.status{padding:10px 12px;background:#edf4fd;border-radius:8px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}nav form{margin:0}nav button{background:none;color:#35577f;padding:4px}@media(max-width:600px){main{margin:18px auto}.panel{padding:17px}}
