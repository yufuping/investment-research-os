{% extends "base.html" %}{% block content %}<section class="panel"><h1>确认完整研究</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<dl><dt>输入名称</dt><dd>{{ company }}</dd><dt>股票代码</dt><dd><strong>{{ ticker }}</strong></dd><dt>重点问题</dt><dd>{{ question or '无额外要求' }}</dd></dl><div class="notice"><strong>费用提醒</strong><br>完整研究将调用 OpenAI 模型并产生 API 费用；日常快速复核不调用大模型。</div><form method="post" action="{{ url_for('research_start') }}"><input type="hidden" name="ticker" value="{{ ticker }}"><input type="hidden" name="question" value="{{ question }}"><label><input style="width:auto" type="checkbox" name="confirm_cost" value="yes" required> 我确认运行完整研究并承担本次 API 费用</label><p><button type="submit">开始生成研究报告</button> <a class="button secondary" href="{{ url_for('dashboard') }}">返回修改</a></p></form></section>{% endblock %}
