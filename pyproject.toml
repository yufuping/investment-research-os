[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-os"
version = "0.1.0"
description = "个人 AI 投资研究系统"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0,<2",
  "psycopg[binary]>=3.2.0,<4",
  "yfinance>=0.2.50",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
investment-os-mcp = "investment_os.app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["investment_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
